plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "kr.moare.android"
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
//        kotlinCompilerExtensionVersion compose_version
        kotlinCompilerExtensionVersion "1.2.0"
//        kotlinCompilerVersion '1.6.10'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.activity:activity-compose:1.3.0-alpha06'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
//    implementation "androidx.compose.foundation:foundation:1.1.1"

    // hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    // navigation
    implementation "androidx.navigation:navigation-compose:2.5.0"
    implementation 'androidx.hilt:hilt-navigation-compose:1.0.0'

    // accompanist
    def accompanist_version = "0.25.0"
    // accompanist pager
    implementation "com.google.accompanist:accompanist-pager:$accompanist_version"
    // accompanist indicators
    implementation "com.google.accompanist:accompanist-pager-indicators:$accompanist_version"
    // accompanist permissions
    implementation "com.google.accompanist:accompanist-permissions:$accompanist_version"
    // accompanist animation navigation
    implementation "com.google.accompanist:accompanist-navigation-animation:$accompanist_version"
    // accompanist swiperefresh
    implementation "com.google.accompanist:accompanist-swiperefresh:$accompanist_version"

    def ktor_version = "2.1.1"
    // ktor client
    implementation "io.ktor:ktor-client-core:$ktor_version"
    implementation "io.ktor:ktor-client-android:$ktor_version"
//    implementation "io.ktor:ktor-client-serialization:$ktor_version"
    implementation "io.ktor:ktor-client-logging:$ktor_version"
//    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.3.0"
    implementation "io.ktor:ktor-client-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"
    implementation "io.ktor:ktor-client-auth:$ktor_version"

    // image
    // coil
    implementation "io.coil-kt:coil-compose:2.1.0"
    implementation "io.coil-kt:coil-video:2.2.0"
    // image compress
    implementation 'id.zelory:compressor:3.0.1'
    // image cropper
    implementation 'com.github.CanHub:Android-Image-Cropper:4.3.2'

    // security
    implementation "androidx.security:security-crypto:1.0.0"

    // datastore
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Stream Chat
    implementation "io.getstream:stream-chat-android-compose:5.8.0"
    implementation "androidx.compose.material:material-icons-extended:$compose_version"

    // ExoPlayer
//    implementation 'com.google.android.exoplayer:exoplayer:2.18.1'
    implementation 'androidx.media3:media3-exoplayer:1.0.0-alpha03'
    implementation "androidx.media3:media3-ui:1.0.0-alpha03"

    // pluck image-picker
    implementation "com.himanshoe:pluck:1.0.0-RC2"

    // location play service
    implementation 'com.google.android.gms:play-services-location:20.0.0'

    // video compress
    implementation 'com.github.AbedElazizShe:LightCompressor:1.2.0'
}